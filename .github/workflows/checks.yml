name: Recipe checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests, manifests, patch hashes and documentation links
        run: python -m unittest discover -s tests -v
      - name: Byte compilation
        run: python -m compileall -q scripts tests
      - name: Inspect launcher without Docker or GPU
        run: python scripts/serve.py --dry-run
